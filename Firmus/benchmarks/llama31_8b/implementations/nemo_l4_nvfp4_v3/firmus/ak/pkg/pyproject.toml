# Firmus L4 v3 (llama31_8b, nemo_l4_nvfp4_v3): the eight auto_kernel patch modules and the firmus_ak package that
# pretrain.py imports first.  Pure Python, no .pth file (gap B-4).  Installed by the Dockerfile, section 5:
#   pip install --no-deps --no-build-isolation /workspace/llm/firmus/ak/pkg
# The compiled kernels are not here: build_all.py builds them into ${FIRMUS_AK_PREFIX} (see ../build_manifest.json).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firmus-ak"
version = "6.1.0+l4"
description = "Firmus auto_kernel patch modules for MLPerf Training v6.1 llama31_8b (workstream L4)"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = [
    "ak_l8b_fp4g_patch",
    "ak_l8b_fp8cs_patch",
    "ak_l8b_gsa",
    "ak_l8b_lmh_patch",
    "ak_l8b_nvfp4p_patch",
    "ak_l8b_opswz",
    "ak_l8b_projcol",
    "ak_l8b_smallk2_patch",
]
packages = ["firmus_ak"]
