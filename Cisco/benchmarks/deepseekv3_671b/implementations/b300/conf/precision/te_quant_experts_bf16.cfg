configs:
  bf16:
    transformer_engine_config_type: "TEQuantizationParams"
    training_recipe: {}

# Matchers are evaluated in order. Keep only expert GEMMs in BF16 while the
# enclosing global autocast and all unmatched Transformer Engine modules use
# NVFP4. The empty training recipe also disables FP4 parameter initialization
# for these modules, so their all-gathered parameters remain BF16.
matchers:
  routed_experts_bf16:
    config: "bf16"
    type: "glob"
    pattern: "*.mlp.experts*"
    enabled: true
  shared_experts_bf16:
    config: "bf16"
    type: "glob"
    pattern: "*.mlp.shared_experts*"
    enabled: true
