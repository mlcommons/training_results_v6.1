defaults: /workspace/optimized/qwen35_397b_grpo_trtllm/pytorch/conf/grpo_qwen35_397b_swe_openhands_async.yaml

env:
  nemo_gym:
    global_aiohttp_connector_limit_per_host: 16384
    swe_agents_train:
      responses_api_agents:
        swe_agents:
          agent_prompt_overrides:
          - user_prompt_template: /workspace/optimized/qwen35_397b_grpo_trtllm/pytorch/prompts/openhands/user_prompt.j2
            system_prompt_template: /workspace/optimized/qwen35_397b_grpo_trtllm/pytorch/prompts/openhands/system_prompt.j2
            agent_cls: CodeActAgent
            diversify_tool_names: false
          concurrency: ${div:${oc.decode:${oc.env:GYM_TRAIN_CONCURRENCY,${policy.train_global_batch_size}}},${env.nemo_gym.shards.0.replicas}}

cluster:
  num_nodes: 32
  segment_size: ${oc.decode:${oc.env:NEMORL_TRAIN_SEGMENT_SIZE,4}}

policy:
  megatron_cfg:
    expert_model_parallel_size: ${oc.decode:${oc.env:EP,8}}
    checkpoint:
      async_save: false
  generation:
    backend: trtllm
    refit_transport: nccl_reshard
    stop_token_ids: [248046, 248044]
    trtllm_cfg:
      tensor_parallel_size: ${oc.decode:${oc.env:TRTLLM_TP,8}}
      precision: ${oc.env:TRTLLM_GEN_PRECISION,fp8}
      is_mx: ${oc.decode:${oc.env:TRTLLM_GEN_IS_MX,true}}
      max_model_len: 65536
      max_batch_size: ${oc.decode:${oc.env:TRTLLM_MAX_BATCH,256}}
      max_num_tokens: 16384
      gpu_memory_utilization: ${oc.decode:${oc.env:TRTLLM_GPU_UTIL,0.8}}
      fp8: false
      moe_expert_parallel_size: ${oc.decode:${oc.env:TRTLLM_MEP,8}}
      async_engine: true
      expose_http_server: true
      in_flight_weight_updates: ${grpo.async_grpo.in_flight_weight_updates}
      recompute_kv_cache_after_weight_updates: ${grpo.async_grpo.recompute_kv_cache_after_weight_updates}
      model_name: ${oc.env:CONTAINER_HF_CKPT_PATH}
      tool_parser: qwen3_coder
      reasoning_parser: deepseek-r1
      default_chat_template_kwargs:
        enable_thinking: false
        truncate_history_thinking: false
    trtllm_kwargs:
      attn_backend: TRTLLM
      moe_config:
        backend: ${oc.env:TRTLLM_MOE_BACKEND,CUTEDSL}
      torch_compile_config: "${oc.decode:${oc.env:TRTLLM_TORCH_COMPILE_CONFIG,'{enable_piecewise_cuda_graph: true, capture_num_tokens: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 768, 1024, 1280, 1536, 1792, 2048, 2304, 2560, 2816, 3072, 3328, 3584, 3840, 4096, 4352, 5376, 6400, 7424, 8448, 10496, 12544, 14592, 16384]}'}}"
      enable_chunked_prefill: true
      kv_cache_config:
        mamba_ssm_cache_dtype: bfloat16
        use_kv_cache_manager_v2: false
        enable_block_reuse: true
        mamba_state_cache_interval: 4096
        mamba_max_off_grid_snapshots_per_chain: ${oc.decode:${oc.env:MAMBA_MAX_OFFGRID,2}}
      disable_mm_encoder: true
      stream_interval: ${oc.decode:${oc.env:TRTLLM_STREAM_INTERVAL,100}}
