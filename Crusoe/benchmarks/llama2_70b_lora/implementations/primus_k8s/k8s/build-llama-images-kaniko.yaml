      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --dockerfile=/context/Dockerfile
            - --context=dir:///context
            - --build-arg=BASE=rocm/amd-mlperf:llama2_70b_training_6.0
            - --destination=__REGISTRY__/llama2-70b-lora-libionic:v61-a77
            - --snapshot-mode=redo
            - --use-new-run
            - --cache=false
            - --verbosity=info
          volumeMounts:
            - { name: context,       mountPath: /context }
            - { name: docker-config, mountPath: /kaniko/.docker }
          resources:
