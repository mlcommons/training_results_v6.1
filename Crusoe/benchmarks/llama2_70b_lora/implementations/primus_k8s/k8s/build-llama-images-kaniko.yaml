            limits:   { cpu: "32", memory: 256Gi }
      volumes:
        - name: context
          configMap: { name: llama-libionic-dockerfile, items: [{ key: Dockerfile, path: Dockerfile }] }
        - name: docker-config
          secret: { secretName: __PUSH_SECRET__, items: [{ key: .dockerconfigjson, path: config.json }] }
