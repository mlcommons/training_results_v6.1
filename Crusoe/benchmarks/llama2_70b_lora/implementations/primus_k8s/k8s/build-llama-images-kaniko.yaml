# In-cluster kaniko build of the two Llama trainer images (Dockerfile.llama-libionic).
# Render, then apply:
#   kubectl --context <ctx> -n <ns> create configmap llama-libionic-dockerfile \
#     --from-file=Dockerfile=Dockerfile.llama-libionic --dry-run=client -o yaml | kubectl --context <ctx> -n <ns> apply -f -
#   sed -e 's|__REGISTRY__|<registry>/<repo>|g' -e 's|__PUSH_SECRET__|<dockerconfigjson-secret>|g' \
#       -e 's|__NODE_8B__|<node>|g' -e 's|__NODE_LORA__|<node>|g' build-llama-images-kaniko.yaml \
#     | kubectl --context <ctx> -n <ns> apply -f -
#
# Runs on GPU nodes (no GPU requested) because the bases are ~28 GB compressed: kaniko
# unpacks the whole base into its own root, which needs the node's large containerd disk;
# small CPU nodes run out of space. The pull also pre-warms that node's image cache.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: build-llama31-8b-libionic
  labels: { app: llama-v61, role: image-build }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app: llama-v61, role: image-build } }
    spec:
      restartPolicy: Never
      nodeName: __NODE_8B__
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --dockerfile=/context/Dockerfile
            - --context=dir:///context
            - --build-arg=BASE=rocm/amd-mlperf:llama31_8b_training_6.0
            - --destination=__REGISTRY__/llama31-8b-libionic:v61-a77
            - --snapshot-mode=redo
            - --use-new-run
            - --cache=false
            - --verbosity=info
          volumeMounts:
            - { name: context,       mountPath: /context }
            - { name: docker-config, mountPath: /kaniko/.docker }
          resources:
            requests: { cpu: "16", memory: 64Gi }
            limits:   { cpu: "32", memory: 256Gi }
      volumes:
        - name: context
          configMap: { name: llama-libionic-dockerfile, items: [{ key: Dockerfile, path: Dockerfile }] }
        - name: docker-config
          secret: { secretName: __PUSH_SECRET__, items: [{ key: .dockerconfigjson, path: config.json }] }
---
apiVersion: batch/v1
kind: Job
metadata:
