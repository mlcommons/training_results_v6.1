# HPE: per-job kernel settings for lodin1/lodin2, applied by the Slurm prolog via
#   sbatch --comment='docker;sysctl file=<this file>'
# zone_reclaim_mode 3 (image setting) evicts the local node's file cache instead
# of using remote NUMA memory: DLRMv4's mmap'd dataset keeps being re-read and
# its loader workers stall in the kernel. 0 is the Linux default (as on lodin4).
vm.zone_reclaim_mode = 0
