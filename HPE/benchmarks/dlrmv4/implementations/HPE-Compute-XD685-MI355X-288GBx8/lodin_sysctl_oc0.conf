# HPE: per-job kernel settings for lodin1/lodin2 (user-authorized 2026-10-12),
# applied by the Slurm prolog via --comment='docker;sysctl file=<this file>'.
# The prolog re-applies the image defaults at every job start.
#  - zone_reclaim_mode 0: Linux default (image: 3).
#  - overcommit_memory 0: Linux default heuristic (image: 2 = strict). Strict mode
#    caps DLRMv4 at ~10 forked loader workers per GPU (each fork reserves ~20 GB).
# Never cancel such a job while its container runs: stop the container first
# (docker rm -f <name> on the node), so strict mode is never restored while
# ~3 TB is committed (that drained lodin1 on 2026-10-12).
vm.zone_reclaim_mode = 0
vm.overcommit_memory = 0
