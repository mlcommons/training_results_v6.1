configs:
  bf16:
    transformer_engine_config_type: "TEQuantizationParams"
    training_recipe: {}

matchers:
  attn_qkv_down_bf16:
    config: "bf16"
    type: "glob"
    pattern: "*.self_attention.linear_qkv_down_proj"
    enabled: true
  attn_q_up_bf16:
    config: "bf16"
    type: "glob"
    pattern: "*.self_attention.linear_q_up_proj"
    enabled: true
  attn_kv_up_bf16:
    config: "bf16"
    type: "glob"
    pattern: "*.self_attention.linear_kv_up_proj"
    enabled: true
  attn_out_bf16:
    config: "bf16"
    type: "glob"
    pattern: "*.self_attention.linear_proj"
    enabled: true